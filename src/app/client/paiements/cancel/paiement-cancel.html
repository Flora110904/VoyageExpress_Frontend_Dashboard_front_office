<div class="payment-cancel">
  <div class="card">
    <div class="icon bg-danger">
      <i class="fa fa-times"></i>
    </div>
    <h1>Paiement annulé</h1>
    <p class="lead">La transaction n'a pas abouti ou a été interrompue.</p>

    <div class="details" *ngIf="transactionId || errorMessage">
      <h2>Informations</h2>
      <ul>
        <li *ngIf="transactionId"><strong>Transaction :</strong> {{ transactionId }}</li>
        <li *ngIf="errorMessage"><strong>Message :</strong> {{ errorMessage }}</li>
      </ul>
    </div>

    <div class="actions">
      <a routerLink="/client/recherche" class="btn btn-outline-primary">
        Rechercher un autre voyage
      </a>
      <a routerLink="/client/mes-reservations" class="btn btn-primary">
        Voir mes réservations
      </a>
    </div>
  </div>
</div>
