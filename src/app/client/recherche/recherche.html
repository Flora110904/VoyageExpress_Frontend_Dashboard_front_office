
<div class="container-fluid py-5">
  <div class="container">
    <h2 class="mb-4">Rechercher & Réserver</h2>

    <!-- Tabs -->
    <ul class="nav nav-tabs mb-4" role="tablist">
      <li class="nav-item">
        <a class="nav-link active" data-bs-toggle="tab" href="#bus">Bus</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" data-bs-toggle="tab" href="#vol">Avion</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" data-bs-toggle="tab" href="#hotel">Hébergement</a>
      </li>
    </ul>

    <!-- Tab Content -->
    <div class="tab-content">
      <!-- Bus Tab -->
      <div id="bus" class="tab-pane active">
        <div class="card">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-4">
                <label>Départ</label>
                <select class="form-select">
                  <option>Dakar</option>
                  <option>Thiès</option>
                  <option>Saint-Louis</option>
                </select>
              </div>
              <div class="col-md-4">
                <label>Arrivée</label>
                <select class="form-select">
                  <option>Thiès</option>
                  <option>Kaolack</option>
                  <option>Ziguinchor</option>
                </select>
              </div>
              <div class="col-md-4">
                <label>Date</label>
                <input type="date" class="form-control">
              </div>
              <div class="col-12">
                <button class="btn btn-primary btn-lg w-100">Rechercher des Bus</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Vol Tab -->
      <div id="vol" class="tab-pane fade">
        <div class="card">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label>Départ</label>
                <select class="form-select">
                  <option>Dakar (DSS)</option>
                  <option>Abidjan (ABJ)</option>
                </select>
              </div>
              <div class="col-md-6">
                <label>Arrivée</label>
                <select class="form-select">
                  <option>Paris (CDG)</option>
                  <option>New York (JFK)</option>
                </select>
              </div>
              <div class="col-md-6">
                <label>Aller</label>
                <input type="date" class="form-control">
              </div>
              <div class="col-md-6">
                <label>Retour</label>
                <input type="date" class="form-control">
              </div>
              <div class="col-12">
                <button class="btn btn-primary btn-lg w-100">Rechercher des Vols</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Hébergement Tab -->
      <div id="hotel" class="tab-pane fade">
        <div class="card">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label>Ville</label>
                <select class="form-select">
                  <option>Dakar</option>
                  <option>Saly</option>
                </select>
              </div>
              <div class="col-md-6">
                <label>Type</label>
                <select class="form-select">
                  <option>Hôtel</option>
                  <option>Appartement</option>
                </select>
              </div>
              <div class="col-md-6">
                <label>Check-in</label>
                <input type="date" class="form-control">
              </div>
              <div class="col-md-6">
                <label>Check-out</label>
                <input type="date" class="form-control">
              </div>
              <div class="col-12">
                <button class="btn btn-primary btn-lg w-100">Rechercher des Hébergements</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<app-footer></app-footer>
