<!-- Login Section -->
<div class="login-container d-flex align-items-center justify-content-center min-vh-100" style="background: var(--hero-gradient);">
  <div class="login-card bg-white rounded-4 shadow-lg p-5" style="max-width: 450px; width: 100%;">
    <!-- Header -->
    <div class="text-center mb-4">
      <div class="login-logo mb-3">
        <i class="fa fa-plane fa-3x text-primary"></i>
      </div>
      <h2 class="fw-bold text-primary mb-2">Bienvenue sur VoyageExpress</h2>
      <p class="text-muted">Connectez-vous à votre compte</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Error Message -->
      <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center mb-4" role="alert">
        <i class="fa fa-exclamation-triangle me-2"></i>
        <div>{{ errorMessage }}</div>
      </div>

      <!-- Email Field -->
      <div class="mb-4">
        <label for="email" class="form-label fw-semibold">
          <i class="fa fa-envelope me-2 text-primary"></i>Adresse Email
        </label>
        <input
          type="email"
          class="form-control form-control-lg"
          id="email"
          formControlName="email"
          placeholder="votre.email@exemple.com"
          [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="invalid-feedback">
          <span *ngIf="loginForm.get('email')?.errors?.['required']">L'adresse email est requise</span>
          <span *ngIf="loginForm.get('email')?.errors?.['email']">Veuillez entrer une adresse email valide</span>
        </div>
      </div>

      <!-- Password Field -->
      <div class="mb-4">
        <label for="password" class="form-label fw-semibold">
          <i class="fa fa-lock me-2 text-primary"></i>Mot de Passe
        </label>
        <div class="input-group input-group-lg">
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-control border-end-0"
            id="password"
            formControlName="password"
            placeholder="Votre mot de passe"
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <button
            class="btn btn-outline-secondary border-start-0"
            type="button"
            (click)="togglePasswordVisibility()">
            <i [class]="showPassword ? 'fa fa-eye-slash' : 'fa fa-eye'"></i>
          </button>
        </div>
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="invalid-feedback">
          <span *ngIf="loginForm.get('password')?.errors?.['required']">Le mot de passe est requis</span>
          <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Le mot de passe doit contenir au moins 6 caractères</span>
        </div>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" formControlName="rememberMe">
            <label class="form-check-label text-muted" for="rememberMe">
              Se souvenir de moi
            </label>
          </div>
        <a href="#" class="text-decoration-none text-primary">Mot de passe oublié ?</a>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="btn btn-primary btn-lg w-100 mb-4"
        [disabled]="isLoading">
        <span *ngIf="!isLoading" class="d-flex align-items-center justify-content-center">
          <i class="fa fa-sign-in-alt me-2"></i>Se Connecter
        </span>
        <span *ngIf="isLoading" class="d-flex align-items-center justify-content-center">
          <span class="spinner-border spinner-border-sm me-2" role="status"></span>
          Connexion en cours...
        </span>
      </button>

  


      <!-- Register Link -->
      <div class="text-center">
        <p class="text-muted mb-0">
          Pas encore de compte ?
          <a routerLink="/auth/register" class="text-decoration-none fw-bold text-primary">
            Créer un compte
          </a>
        </p>
      </div>
    </form>
  </div>
</div>
